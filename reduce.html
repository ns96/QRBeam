<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV/TSV Row Averager</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            text-align: center;
        }
        .dataGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1 1 auto;
            min-height: 0;
        }
        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel h2 {
            margin: 0 0 4px;
            font-size: 15px;
        }
        textarea {
            flex: 1 1 auto;
            width: 100%;
            box-sizing: border-box;
            min-height: 160px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            resize: vertical;
        }
        .fieldRow {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .fieldRow label {
            font-weight: bold;
        }
        .fieldRow input {
            width: 70px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .panelButtons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .panelButtons button {
            flex: 1 1 0;
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background-color: #007BFF;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        .panelButtons button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 800px) {
            .dataGrid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>CSV/TSV Row Averager v2.4.2 (10/20/2026)</h1>

    <div class="dataGrid">
        <div class="panel">
            <h2>Input Data</h2>
            <textarea id="dataInput" placeholder="Paste your CSV or TSV data here"></textarea>
            <div class="fieldRow">
                <label for="rowCount">Number of rows to average:</label>
                <input type="number" id="rowCount" min="1" value="2">
            </div>
            <div class="panelButtons">
                <button onclick="document.getElementById('fileInput').click()">Open CSV/TSV File</button>
                <button onclick="averageRows()">Average Rows</button>
            </div>
        </div>
        <div class="panel">
            <h2>Output Data</h2>
            <textarea id="dataOutput" readonly placeholder="Averaged data will appear here"></textarea>
            <div class="fieldRow">
                <label for="decimalPlaces">Decimal places to round to:</label>
                <input type="number" id="decimalPlaces" min="0" value="2">
            </div>
            <div class="panelButtons">
                <button onclick="copyToClipboard()">Copy to Clipboard</button>
                <button onclick="saveToFile()">Save to File</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".csv,.tsv,text/csv,text/tab-separated-values" style="display: none;">

    <script>
        function averageRows() {
            const dataInput = document.getElementById('dataInput').value;
            const rowCount = parseInt(document.getElementById('rowCount').value);
            const decimalPlaces = parseInt(document.getElementById('decimalPlaces').value);
            if (isNaN(rowCount) || rowCount < 1) {
                alert('Please enter a valid number of rows to average.');
                return;
            }
            if (isNaN(decimalPlaces) || decimalPlaces < 0) {
                alert('Please enter a valid number of decimal places.');
                return;
            }

            const delimiter = dataInput.includes('\t') ? '\t' : ',';
            const lines = dataInput.trim().split('\n');
            const headers = lines[0];
            const rows = lines.slice(1).map(row => row.split(delimiter).map(Number));
            const averagedRows = [];

            for (let i = 0; i < rows.length; i += rowCount) {
                const chunk = rows.slice(i, i + rowCount);
                const averagedRow = chunk[0].map((_, colIndex) => {
                    const sum = chunk.reduce((acc, row) => acc + row[colIndex], 0);
                    return (sum / chunk.length).toFixed(decimalPlaces);
                });
                averagedRows.push(averagedRow);
            }

            const dataOutput = [headers, ...averagedRows.map(row => row.join(delimiter))].join('\n');
            document.getElementById('dataOutput').value = dataOutput;
        }

        function copyToClipboard() {
            const dataOutput = document.getElementById('dataOutput');
            dataOutput.select();
            dataOutput.setSelectionRange(0, 99999); // For mobile devices
            document.execCommand('copy');
            alert('Copied to clipboard');
        }

        // Save the reduced data, using the delimiter to pick between CSV and TSV
        let loadedFileName = '';

        function saveToFile() {
            const data = document.getElementById('dataOutput').value.trim();
            if (!data) {
                alert('No reduced data to save. Use Average Rows first.');
                return;
            }

            const delimiter = data.includes('\t') ? '\t' : ',';
            const extension = delimiter === '\t' ? 'tsv' : 'csv';
            const baseName = loadedFileName
                ? loadedFileName.replace(/\.[^.]+$/, '') + '_reduced'
                : 'reduced_data';

            const blob = new Blob([data], { type: delimiter === '\t' ? 'text/tab-separated-values' : 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${baseName}.${extension}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Load the contents of a CSV/TSV file from the computer into the input area
        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('dataInput').value = e.target.result.replace(/\r\n?/g, '\n');
                loadedFileName = file.name;
            };
            reader.onerror = function () {
                console.error('Error reading file:', reader.error);
            };
            reader.readAsText(file);
            event.target.value = "";  // Allow selecting the same file again
        });
    </script>
</body>
</html>
