<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Data Sender</title>
    <script src="js/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        #inputArea {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        #qrContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .qrCode {
            margin: 20px;  /* Increased margin for better separation */
            padding: 10px;
            background-color: #fff;
            text-align: center;  /* To center the number */
            border: 1px solid #ddd;  /* Optional: Adds border around each QR code */
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .buttonRow {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .buttonRow button {
            flex: 1 1 0;
            width: auto;
            min-width: 120px;
            margin-bottom: 0;
        }
        .qrLabel {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #characterCount {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
        #playDialog {
            border: none;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            background-color: #fff;
        }
        #playDialog::backdrop, #reduceDialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }
        #playLabel {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #playCanvas {
            width: min(70vh, 80vw);
            height: min(70vh, 80vw);
            background-color: #fff;
        }
        #reduceDialog {
            border: none;
            border-radius: 8px;
            padding: 16px;
            background-color: #fff;
            min-width: 320px;
            text-align: center;
        }
        #reduceDialog label {
            display: block;
            font-weight: bold;
            margin: 10px 0 4px;
            text-align: left;
        }
        #reduceDialog input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #reduceMessage {
            min-height: 18px;
            margin-top: 10px;
            font-size: 14px;
        }
        #playDialog button, #reduceDialog button {
            display: inline-block;
            width: auto;
            margin: 6px;
        }
        #playDialog button:disabled, #reduceDialog button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .dialogControls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-top: 12px;
        }
        .speedControl {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: bold;
        }
        #speedSelect {
            padding: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>QR Data Sender v2.2.0 (10/18/2026)</h1>
    <textarea id="inputArea" placeholder="Enter data to generate QR codes"></textarea>
    <div class="buttonRow">
        <button onclick="generateQRCodes()">Generate QR Codes</button>
        <button onclick="clearQRCodes()">Clear</button>
        <button onclick="document.getElementById('fileInput').click()">Open CSV/TSV File</button>
        <button onclick="playQRCodes()">Play QR</button>
        <button onclick="openReduceDialog()">Data Reduce</button>
    </div>
    <input type="file" id="fileInput" accept=".csv,.tsv,text/csv,text/tab-separated-values" style="display: none;">

    <div id="qrContainer"></div>
    <div id="characterCount"></div>

    <dialog id="playDialog">
        <div id="playLabel">QR Code 1 of 1</div>
        <canvas id="playCanvas"></canvas>
        <div class="dialogControls">
            <label class="speedControl" for="speedSelect">Speed
                <select id="speedSelect">
                    <option value="100">0.1 s</option>
                    <option value="250">0.25 s</option>
                    <option value="500">0.5 s</option>
                    <option value="1000" selected>1 s</option>
                </select>
            </label>
            <button id="backButton">Back</button>
            <button id="startButton">Start</button>
            <button id="pauseButton" disabled>Pause</button>
            <button id="closePlayButton">Close</button>
        </div>
    </dialog>

    <dialog id="reduceDialog">
        <div id="reduceTitle">Data Reduce</div>
        <label for="reduceRows">Number of rows to average:</label>
        <input type="number" id="reduceRows" min="1" value="2">
        <label for="reduceDecimals">Decimal places to round to:</label>
        <input type="number" id="reduceDecimals" min="0" value="2">
        <div id="reduceMessage"></div>
        <div class="dialogControls">
            <button id="applyReduceButton">Reduce Data</button>
            <button id="revertReduceButton" disabled>Revert</button>
            <button id="closeReduceButton">Close</button>
        </div>
    </dialog>

    <script>
        // Build the sequence-numbered chunks that are encoded into QR codes
        function getQRChunks(data) {
            var maxLines = 10;  // Maximum lines per QR code
            const lines = data.split('\n');

            const lineCount = lines.length;
            if (lineCount <= 2*maxLines) {
                maxLines = Math.ceil(lineCount/2);
            }

            // Group lines into chunks based on the maxLines
            const chunks = [];
            for (let i = 0; i < lines.length; i += maxLines) {
                chunks.push(lines.slice(i, i + maxLines).join('\n'));
            }

            // add the index to the qrcode to be able to reassemble the data in the correct order
            return chunks.map((chunk, index) => pad(index, 3) + chunk);
        }

        function generateQRCodes() {
            const data = document.getElementById('inputArea').value;
            const qrContainer = document.getElementById('qrContainer');
            const characterCount = document.getElementById('characterCount');
            
            qrContainer.innerHTML = "";  // Clear previous QR codes
            characterCount.textContent = ""; // Clear previous character count

            const chunks = getQRChunks(data);

            // Generate QR code for each chunk of data
            chunks.forEach((chunk, index) => {
                // Create a container for each QR code
                const qrCodeDiv = document.createElement('div');
                qrCodeDiv.classList.add('qrCode');
                
                // Create label for the QR code
                const qrLabel = document.createElement('div');
                qrLabel.classList.add('qrLabel');
                qrLabel.textContent = `QR Code ${index + 1}`;  // Number the QR codes
                qrCodeDiv.appendChild(qrLabel);

                qrContainer.appendChild(qrCodeDiv);

                // Create a canvas element for the QR code
                const canvas = document.createElement('canvas');
                qrCodeDiv.appendChild(canvas);

                // Generate a QR code for each chunk and render it to the canvas
                QRCode.toCanvas(canvas, chunk, { errorCorrectionLevel: 'H' }, function (error) {
                    if (error) {
                        console.error('Error generating QR code:', error);
                    }
                });
            });

            // Display the total number of characters processed
            characterCount.textContent = `Total characters processed: ${data.length}`;
        }

        // Sequentially display the generated QR codes so a stationary camera can read them
        const playDialog = document.getElementById('playDialog');
        const playCanvas = document.getElementById('playCanvas');
        const playLabel = document.getElementById('playLabel');
        const backButton = document.getElementById('backButton');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const speedSelect = document.getElementById('speedSelect');
        let playIntervalMs = Number(speedSelect.value);
        let playingChunks = [];
        let playIndex = 0;
        let playTimer = null;

        function renderPlayFrame() {
            playLabel.textContent = `QR Code ${playIndex + 1} of ${playingChunks.length}`;
            QRCode.toCanvas(playCanvas, playingChunks[playIndex], {
                errorCorrectionLevel: 'H',
                width: 640,
                margin: 4
            }, function (error) {
                if (error) {
                    console.error('Error generating QR code:', error);
                }
            });
        }

        function startPlayTimer() {
            if (playTimer !== null) {
                clearInterval(playTimer);
            }
            playTimer = setInterval(() => {
                playIndex = (playIndex + 1) % playingChunks.length;
                renderPlayFrame();
            }, playIntervalMs);
        }

        function pausePlayback() {
            if (playTimer !== null) {
                clearInterval(playTimer);
                playTimer = null;
            }
        }

        function updatePlaybackButtons() {
            const playing = playTimer !== null;
            startButton.disabled = playing;
            pauseButton.disabled = !playing;
        }

        function playQRCodes() {
            const characterCount = document.getElementById('characterCount');
            const data = document.getElementById('inputArea').value;

            if (!data) {
                characterCount.textContent = 'Nothing to play - enter or open data first.';
                return;
            }

            // Show the first QR code and wait for Start so the phone can be aligned
            playingChunks = getQRChunks(data);
            playIndex = 0;
            pausePlayback();
            renderPlayFrame();
            updatePlaybackButtons();

            if (!playDialog.open) {
                playDialog.showModal();
            }
        }

        function stopPlayback() {
            pausePlayback();
            playingChunks = [];
            if (playDialog.open) {
                playDialog.close();
            }
        }

        document.getElementById('closePlayButton').addEventListener('click', stopPlayback);

        startButton.addEventListener('click', () => {
            if (playingChunks.length === 0) return;
            startPlayTimer();
            updatePlaybackButtons();
        });

        backButton.addEventListener('click', () => {
            if (playingChunks.length === 0) return;
            playIndex = (playIndex - 1 + playingChunks.length) % playingChunks.length;
            renderPlayFrame();
        });

        pauseButton.addEventListener('click', () => {
            if (playingChunks.length === 0) return;
            pausePlayback();
            updatePlaybackButtons();
        });

        speedSelect.addEventListener('change', () => {
            playIntervalMs = Number(speedSelect.value);
            // Apply the new speed immediately while playing
            if (playTimer !== null) {
                startPlayTimer();
            }
        });

        playDialog.addEventListener('cancel', (event) => {
            event.preventDefault();
            stopPlayback();
        });
        playDialog.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                stopPlayback();
            }
        });
        playDialog.addEventListener('close', () => {
            pausePlayback();
            playingChunks = [];
            updatePlaybackButtons();
        });

        // Data reduction: average groups of rows and round to the requested decimals
        const inputArea = document.getElementById('inputArea');
        const reduceDialog = document.getElementById('reduceDialog');
        const reduceRows = document.getElementById('reduceRows');
        const reduceDecimals = document.getElementById('reduceDecimals');
        const reduceMessage = document.getElementById('reduceMessage');
        const revertReduceButton = document.getElementById('revertReduceButton');
        let reduceOriginalData = null;

        function updateRevertButton() {
            revertReduceButton.disabled = reduceOriginalData === null;
        }

        function openReduceDialog() {
            if (!inputArea.value) {
                document.getElementById('characterCount').textContent = 'Nothing to reduce - enter or open data first.';
                return;
            }
            reduceMessage.textContent = '';
            updateRevertButton();
            if (!reduceDialog.open) {
                reduceDialog.showModal();
            }
        }

        function applyDataReduction() {
            const rowCount = parseInt(reduceRows.value, 10);
            const decimalPlaces = parseInt(reduceDecimals.value, 10);

            if (isNaN(rowCount) || rowCount < 1) {
                reduceMessage.textContent = 'Enter a valid number of rows to average.';
                return;
            }
            if (isNaN(decimalPlaces) || decimalPlaces < 0) {
                reduceMessage.textContent = 'Enter a valid number of decimal places.';
                return;
            }

            const dataInput = inputArea.value;
            const delimiter = dataInput.includes('\t') ? '\t' : ',';
            const lines = dataInput.trim().split('\n').filter(line => line.trim() !== '');
            const headers = lines[0];
            const rows = lines.slice(1).map(row => row.split(delimiter).map(Number));

            if (rows.length === 0) {
                reduceMessage.textContent = 'No data rows to reduce (only a header row was found).';
                return;
            }
            if (rows.some(row => row.some(value => isNaN(value)))) {
                reduceMessage.textContent = 'Data rows must contain numbers only.';
                return;
            }

            const averagedRows = [];
            for (let i = 0; i < rows.length; i += rowCount) {
                const chunk = rows.slice(i, i + rowCount);
                const averagedRow = chunk[0].map((_, colIndex) => {
                    const sum = chunk.reduce((acc, row) => acc + row[colIndex], 0);
                    return (sum / chunk.length).toFixed(decimalPlaces);
                });
                averagedRows.push(averagedRow);
            }

            // Keep the pre-reduction data so it can be restored
            if (reduceOriginalData === null) {
                reduceOriginalData = dataInput;
            }

            inputArea.value = [headers, ...averagedRows.map(row => row.join(delimiter))].join('\n');
            updateRevertButton();
            reduceMessage.textContent = `Reduced ${rows.length} data rows to ${averagedRows.length} rows with ${decimalPlaces} decimal places.`;
        }

        function revertDataReduction() {
            if (reduceOriginalData === null) return;
            inputArea.value = reduceOriginalData;
            reduceOriginalData = null;
            updateRevertButton();
            reduceMessage.textContent = 'Data reverted to the original.';
        }

        document.getElementById('applyReduceButton').addEventListener('click', applyDataReduction);
        revertReduceButton.addEventListener('click', revertDataReduction);
        document.getElementById('closeReduceButton').addEventListener('click', () => reduceDialog.close());
        reduceDialog.addEventListener('cancel', (event) => {
            event.preventDefault();
            reduceDialog.close();
        });
        reduceDialog.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                reduceDialog.close();
            }
        });
        // A manual edit invalidates the snapshot the Revert button restores
        inputArea.addEventListener('input', () => {
            reduceOriginalData = null;
            updateRevertButton();
        });

        // add function to display qrcode which links to the qrscan.html page
        function displayQRForScanner() {
            const qrContainer = document.getElementById('qrContainer');
            const qrCodeDiv = document.createElement('div');
            qrCodeDiv.classList.add('qrCode');
            qrContainer.appendChild(qrCodeDiv);

            // Create a canvas element for the QR code 
            const canvas = document.createElement('canvas');
            qrCodeDiv.appendChild(canvas);  

            // Generate a QR code for the data and render it to the canvas
            QRCode.toCanvas(canvas, 'https://ns96.github.io/QRBeam/qrscan.html', { errorCorrectionLevel: 'H' }, function (error) {
                if (error) {
                    console.error('Error generating QR code:', error);
                }
            });

            // add element to display the link to the reduce.html page in new tab
            const reducerLink = document.createElement('div');
            reducerLink.classList.add('qrLabel');
            reducerLink.innerHTML = '<a target="_blank" href="reduce.html">Open Data Reducer</a>';
            qrCodeDiv.appendChild(reducerLink);
        } 

        // function  to left zero pad a number
        function pad(num, size) {
            var s = num + "";
            while (s.length < size) s = "0" + s;
            return s;
        }

        function clearQRCodes() {
            document.getElementById('inputArea').value = "";
            document.getElementById('qrContainer').innerHTML = "";
            document.getElementById('characterCount').textContent = "";
            reduceOriginalData = null;
            updateRevertButton();
            displayQRForScanner();
        }

        // Load the contents of a CSV/TSV file from the computer into the input area
        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                // Normalize line endings so line-based QR chunking behaves consistently
                document.getElementById('inputArea').value = e.target.result.replace(/\r\n?/g, '\n');
                // New data: previous reduction snapshot no longer applies
                reduceOriginalData = null;
                updateRevertButton();
            };
            reader.onerror = function () {
                console.error('Error reading file:', reader.error);
            };
            reader.readAsText(file);
            event.target.value = "";  // Allow selecting the same file again
        });

        // Display QR code for the scanner
        displayQRForScanner();
    </script>

</body>
</html>
