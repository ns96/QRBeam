<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QR Scanner</title>
    <script src="js/jsQR.js"></script>
    <script src="js/plotly-basic.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            background-color: #f4f4f9;
            color: #333;
            overflow-x: hidden;
        }

        h1 {
            font-size: 20px;
            margin: 4px 0 8px;
            text-align: center;
        }

        .app {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .cameraSection {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .dataSection {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .cameraWrap {
            position: relative;
            width: 100%;
            max-width: 520px;
            min-height: 200px;
            margin: 0 auto;
            background-color: #000;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        #video {
            display: block;
            width: 100%;
            height: auto;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #qrmessage {
            min-height: 20px;
            font-size: 16px;
            text-align: center;
        }

        #qrmessage.complete {
            color: #1b7f3b;
            font-size: 18px;
            font-weight: bold;
        }

        #cameraError {
            color: #b00020;
            font-size: 14px;
            text-align: center;
        }

        button {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover {
            background-color: #45a049;
        }

        .plotButton {
            background-color: #ffd000;
            color: #333;
        }

        .plotButton:hover {
            background-color: #ffcc00;
        }

        #textarea {
            width: 100%;
            height: 28vh;
            min-height: 140px;
            padding: 8px;
            font-family: inherit;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        .plotWrap {
            width: 100%;
        }

        #plot {
            width: 100%;
            min-width: 0;
            height: min(45vh, 420px);
        }

        .plotWrap.expanded {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));
            background-color: #fff;
        }

        .plotWrap.expanded #plot {
            flex: 1 1 auto;
            height: auto !important;
            min-height: 0;
        }

        @media (min-width: 700px) {
            body {
                padding: 16px;
                max-width: 1100px;
                margin: 0 auto;
            }

            h1 {
                font-size: 24px;
            }

            .app {
                display: grid;
                grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr);
                align-items: start;
                gap: 16px;
            }

            #textarea {
                height: 220px;
            }

            #plot {
                height: 360px;
            }
        }
    </style>
</head>
<body>
    <h1>Data Scanner v2.4.1 (10/18/2026)</h1>
    <div class="app">
        <section class="cameraSection">
            <div class="cameraWrap">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
            <div id="qrmessage" aria-live="polite"></div>
            <div id="cameraError"></div>
            <button id="cameraButton">Stop Camera</button>
        </section>

        <section class="dataSection">
            <textarea id="textarea" placeholder="Scanned QR code data will appear here..."></textarea>
            <button id="copyButton">Copy to Clipboard</button>
            <button id="clearButton">Clear</button>
            <button id="saveButton">Save to File</button>
            <button id="plotButton" class="plotButton">XY Plot</button>
            <button id="plotButton2" class="plotButton">XYY Plot</button>
            <button id="barPlotButton" class="plotButton">Bar Plot</button>
            <div class="plotWrap" id="plotWrap">
                <div id="plot"></div>
                <button id="expandPlotButton">Expand Plot</button>
            </div>
        </section>
    </div>
    
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const textarea = document.getElementById('textarea');
        const messageElement = document.getElementById('qrmessage');
        const clearButton = document.getElementById('clearButton');
        const copyButton = document.getElementById('copyButton');
        const saveButton = document.getElementById('saveButton');
        const plotArea = document.getElementById('plot');
        const plotButton = document.getElementById('plotButton');
        const plotButton2 = document.getElementById('plotButton2');
        const barPlotButton = document.getElementById('barPlotButton');
        const cameraButton = document.getElementById('cameraButton');
        const cameraError = document.getElementById('cameraError');

        var qrCodeNumber = 0;
        const scannedNumbers = new Set();
        let expectedTotal = null;
        let scanComplete = false;

        let scanning = false;
        let cameraStream = null;
        let animationFrameId = null;
        let audioContext = null;

        // Access the user's camera
        async function startCamera() {
            cameraError.textContent = '';
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Camera access is not supported in this browser');
                }
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = cameraStream;
                await video.play();
                cameraButton.textContent = 'Stop Camera';
                startScanning();
            } catch (err) {
                console.error("Error accessing camera: ", err);
                cameraStream = null;
                cameraError.textContent = 'Unable to access the camera (' + (err.message || err.name) +
                    '). Allow camera permission and try again; camera access requires HTTPS or localhost.';
                cameraButton.textContent = 'Start Camera';
            }
        }

        function stopCamera() {
            stopScanning();
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            video.srcObject = null;
            cameraButton.textContent = 'Start Camera';
        }

        function startScanning() {
            if (scanning) return;
            scanning = true;
            animationFrameId = requestAnimationFrame(scanQRCode);
        }

        function stopScanning() {
            scanning = false;
            if (animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function drawBox(code, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(code.location.topLeftCorner.x, code.location.topLeftCorner.y);
            ctx.lineTo(code.location.topRightCorner.x, code.location.topRightCorner.y);
            ctx.lineTo(code.location.bottomRightCorner.x, code.location.bottomRightCorner.y);
            ctx.lineTo(code.location.bottomLeftCorner.x, code.location.bottomLeftCorner.y);
            ctx.closePath();
            ctx.stroke();
        }

        function scanQRCode() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);

                if (code) {
                    drawBox(code, handleScan(code));
                }
            }

            animationFrameId = requestAnimationFrame(scanQRCode);
        }

        // Process one decoded QR code and return the overlay color to draw
        function handleScan(code) {
            const scanned = code.data;

            // New codes carry "index/total" (e.g. 000/003); old codes only carry the index.
            // The total is exactly 3 digits so data beginning with digits is not swallowed.
            const totalMatch = /^(\d{3})\/(\d{3})/.exec(scanned);
            const indexMatch = totalMatch || /^(\d{3})/.exec(scanned);
            if (!indexMatch) {
                messageElement.textContent = 'Not a QRBeam data code (missing sequence number).';
                return 'red';
            }

            if (scanComplete) {
                return 'green';
            }

            const scanNumber = Number(indexMatch[1]);
            const totalFromCode = totalMatch ? Number(totalMatch[2]) : null;
            const scannedData = scanned.substring(indexMatch[0].length);

            // All new-format codes must agree on how many codes the set contains
            if (totalFromCode !== null) {
                if (expectedTotal === null) {
                    expectedTotal = totalFromCode;
                } else if (expectedTotal !== totalFromCode) {
                    messageElement.textContent = `Different QR code set (${totalFromCode} codes). Press Clear to start over.`;
                    return 'red';
                }
            }

            const totalSuffix = expectedTotal !== null ? ` of ${expectedTotal}` : '';

            if (scannedNumbers.has(scanNumber)) {
                // Old codes have no total, so a loop back to the first code means the set is complete
                if (expectedTotal === null && scanNumber === 0 && qrCodeNumber > 0) {
                    return completeScan(qrCodeNumber);
                }
                messageElement.textContent = `QR Code# ${scanNumber + 1} already scanned. Waiting for QR Code# ${qrCodeNumber + 1}${totalSuffix}`;
                return 'yellow';
            }

            if (scanNumber !== qrCodeNumber) {
                messageElement.textContent = `Out of sequence QR Code# ${scanNumber + 1}. Expected QR Code# ${qrCodeNumber + 1}${totalSuffix}`;
                return 'red';
            }

            if (scannedData.length === 0) {
                messageElement.textContent = `QR Code# ${scanNumber + 1} contains no data. Waiting for QR Code# ${qrCodeNumber + 1}${totalSuffix}`;
                return 'yellow';
            }

            textarea.value += scannedData + '\n';
            scannedNumbers.add(scanNumber);
            qrCodeNumber++;

            if (expectedTotal !== null && scannedNumbers.size >= expectedTotal) {
                return completeScan(expectedTotal);
            }

            messageElement.textContent = `Scanned QR Code# ${qrCodeNumber}${totalSuffix}`;
            playBeep();
            return 'green';
        }

        function completeScan(total) {
            scanComplete = true;
            messageElement.textContent = `All ${total} QR codes scanned`;
            messageElement.classList.add('complete');
            playCompleteBeep();
            return 'green';
        }

        function resetScanState() {
            scanComplete = false;
            expectedTotal = null;
            messageElement.classList.remove('complete');
        }

        function getAudioContext() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;

            // Reuse one context; browsers limit how many can be created
            if (!audioContext) {
                audioContext = new AudioCtx();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playBeep() {
            const ctx = getAudioContext();
            if (!ctx) return;

            const oscillator = ctx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, ctx.currentTime); // A4 note
            oscillator.connect(ctx.destination);
            oscillator.start();
            oscillator.stop(ctx.currentTime + 0.1); // Beep for 0.1 seconds
        }

        function playCompleteBeep() {
            const ctx = getAudioContext();
            if (!ctx) return;

            // Two rising tones to signal that every code has been scanned
            [660, 880].forEach((frequency, index) => {
                const start = ctx.currentTime + index * 0.12;
                const oscillator = ctx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, start);
                oscillator.connect(ctx.destination);
                oscillator.start(start);
                oscillator.stop(start + 0.1);
            });
        }

        function drawPlot(dataInput, type='xy') {
            // Get the data from the textarea
            const lines = dataInput.trim().split("\n");
            const xValues = [];
            const yValues = [];
            const y2Values = [];

            // Parse the data into X and Y arrays
            for (const line of lines) {
                if(type == 'bar') {
                    const [x, y] = line.split(/[\t,]/);
                    if (x && !isNaN(Number(y))) {
                        xValues.push(x);
                        yValues.push(Number(y));
                    }

                } else if (type == 'xyy') {
                    const [x, y, y2] = line.split(/[\t,]/).map(Number);
                    if (!isNaN(x) && !isNaN(y) && !isNaN(y2)) {
                        xValues.push(x);
                        yValues.push(y);
                        y2Values.push(y2);
                    }                        
                } else {
                    const [x, y] = line.split(/[\t,]/).map(Number);
                    if (!isNaN(x) && !isNaN(y)) {
                        xValues.push(x);
                        yValues.push(y);
                    }
                }
            }

            var trace;
            var trace2;
            var plotTitle;

            if (type == 'bar') {
                trace = {
                    x: xValues,
                    y: yValues,
                    type: 'bar'
                };

                plotTitle = 'Bar Plot';
            } else if(type == 'xyy') {
                trace = {
                    x: xValues,
                    y: yValues,
                    mode: 'lines+markers',
                    type: 'scatter',
                    name: 'Y1'
                };

                trace2 = {
                    x: xValues,
                    y: y2Values,
                    mode: 'lines+markers',
                    type: 'scatter',
                    name: 'Y2'
                };

                plotTitle = 'X-Y2 Data Plot';  
            } else {
                trace = {
                    x: xValues,
                    y: yValues,
                    mode: 'lines+markers',
                    type: 'scatter',
                    marker: { color: 'blue', size: 8 },
                    name: 'Data Points'
                };
                
                plotTitle = 'X-Y Data Plot';
            }
            
            var data = [trace];
            if(trace2) {
                data = [trace, trace2];
            }

            // Define the plot layout
            const layout = {
                title: plotTitle,
                autosize: true,
                font: { size: 12 },
                margin: { l: 45, r: 15, t: 40, b: 45 },
                legend: { orientation: 'h' },
                xaxis: { title: 'X Axis', automargin: true },
                yaxis: { title: 'Y Axis', automargin: true }
            };
            const config = {
                responsive: true,
                displayModeBar: false,
                scrollZoom: false,
                doubleClick: 'reset'
            };

            // Render the plot in the div with id="plot"
            Plotly.newPlot('plot', data, layout, config).then(() => {
                Plotly.Plots.resize('plot');
            });
        }

        let plotResizeTimer = null;
        function resizePlot() {
            if (plotArea.data) {
                Plotly.Plots.resize(plotArea);
            }
        }
        function schedulePlotResize(delay) {
            clearTimeout(plotResizeTimer);
            plotResizeTimer = setTimeout(resizePlot, delay);
        }

        const plotWrap = document.getElementById('plotWrap');
        const expandPlotButton = document.getElementById('expandPlotButton');

        function togglePlotExpanded() {
            const expanded = plotWrap.classList.toggle('expanded');
            expandPlotButton.textContent = expanded ? 'Close Plot' : 'Expand Plot';
            schedulePlotResize(100);
        }

        expandPlotButton.addEventListener('click', togglePlotExpanded);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && plotWrap.classList.contains('expanded')) {
                togglePlotExpanded();
            }
        });
        window.addEventListener('resize', () => schedulePlotResize(150));
        window.addEventListener('orientationchange', () => schedulePlotResize(250));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => schedulePlotResize(150));
        }

        video.addEventListener('play', startScanning);

        cameraButton.addEventListener('click', () => {
            if (cameraStream) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        copyButton.addEventListener('click', () => {
            textarea.select();
            document.execCommand('copy');
            alert('Text copied to clipboard!');
        });

        clearButton.addEventListener('click', () => {
            textarea.value = '';
            messageElement.textContent = '';
            qrCodeNumber = 0;
            scannedNumbers.clear();
            resetScanState();
            Plotly.purge(plotArea);
        });

        // Local time stamp safe for file names (no colons or slashes)
        function timestampForFileName(date = new Date()) {
            const pad = (value) => String(value).padStart(2, '0');
            const day = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
            const time = `${pad(date.getHours())}-${pad(date.getMinutes())}-${pad(date.getSeconds())}`;
            return `${day}_${time}`;
        }

        saveButton.addEventListener('click', () => {
            const data = textarea.value.trim();
            if (data) {
                const blob = new Blob([data], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `scanned_data_${timestampForFileName()}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        plotButton.addEventListener('click', () => {
            const data = textarea.value.trim();
            if (data) {
                drawPlot(data);
            }
        });

        plotButton2.addEventListener('click', () => {
            const data = textarea.value.trim();
            if (data) {
                drawPlot(data, 'xyy');
            }
        });

        barPlotButton.addEventListener('click', () => {
            const data = textarea.value.trim();
            if (data) {
                drawPlot(data, 'bar');
            }
        });

        // Start the camera and scanning on load
        startCamera();
    </script>
</body>
</html>
